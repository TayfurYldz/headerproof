name: HeaderProof CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -U pip pytest build

      - name: Compile
        run: python -m compileall -q header_active_scan.py src/headerproof

      - name: Test
        run: python -m pytest -q

      - name: Build package
        run: python -m build

      - name: Attest build artifacts
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Installed entrypoint smoke test
        run: |
          python -m pip install dist/*.whl
          headerproof --help

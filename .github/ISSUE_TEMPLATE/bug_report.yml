name: Bug report
description: Report a scanner bug with sanitized evidence.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Include the exact command, with target-sensitive paths or URLs sanitized.
      render: bash
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Sanitized input
      description: Provide a minimal input sample that reproduces the issue.
      render: text
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checklist
      options:
        - label: I removed secrets, cookies, tokens, private URLs, and third-party exploit evidence.
          required: true

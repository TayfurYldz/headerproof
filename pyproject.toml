[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "header-active-scan"
version = "1.0.0"
description = "Fast active scanner for CORS, CSRF, header injection, cache poisoning, and content spoofing leads."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tayfur Yildiz" }]
keywords = ["security", "cors", "csrf", "cache-poisoning", "header-injection", "bug-bounty"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
header-active-scan = "header_active_scan:main"

[tool.setuptools]
py-modules = ["header_active_scan", "file_safety"]

[tool.pytest.ini_options]
testpaths = ["tests"]

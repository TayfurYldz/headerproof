[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "headerproof"
version = "1.3.1"
description = "Fast, low-noise active scanner for CORS, CSRF, header injection, cache poisoning, and content spoofing leads."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tayfur Yildiz" }]
keywords = ["security", "cors", "csrf", "cache-poisoning", "header-injection", "bug-bounty", "headers"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
test = [
  "jsonschema>=4.23",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/TayfurYldz/headerproof"
Repository = "https://github.com/TayfurYldz/headerproof"
Issues = "https://github.com/TayfurYldz/headerproof/issues"
Changelog = "https://github.com/TayfurYldz/headerproof/blob/main/CHANGELOG.md"

[project.scripts]
headerproof = "headerproof.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["headerproof"]

[tool.setuptools.data-files]
"share/headerproof/schemas" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src/headerproof"]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
